# Ansible playbook to set up a systemd service and timer to build packages
# nightly and make them available via local-apt-repository.
#
# ansible-playbook --ask-become-pass playbook.yaml

---
- name: Set up debs with local-apt-repository
  hosts: localhost
  connection: local

  vars:
    repo_owner: "{{ ansible_user | default(ansible_user_id) }}"
    unit_name: debs
    build_time: "06:00"

  tasks:

    - name: Install dependencies
      become: true
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - local-apt-repository
        - debhelper
        - dh-apparmor
        - gh

    # Keep in sync with Build-Depends in packages/kitty-gtk/debian/control.
    # kitty-gtk also needs uv, which debs packages.
    - name: Install kitty-gtk build dependencies
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - golang-go
          - libadwaita-1-dev
          - libcairo2-dev
          - libcanberra-dev
          - libdbus-1-dev
          - libfontconfig-dev
          - libgl1-mesa-dev
          - libgtk-4-dev
          - libharfbuzz-dev
          - liblcms2-dev
          - libpng-dev
          - libsimde-dev
          - libssl-dev
          - libsystemd-dev
          - libwayland-dev
          - libxcursor-dev
          - libxi-dev
          - libxinerama-dev
          - libxkbcommon-dev
          - libxkbcommon-x11-dev
          - libxrandr-dev
          - libxxhash-dev
          - ncurses-bin
          - pkg-config
          - python3-dev
          - wayland-protocols
          - xz-utils
          - zlib1g-dev
        state: present

    - name: Configure local-apt-repository ownership
      become: true
      ansible.builtin.file:
        path: /srv/local-apt-repository
        state: directory
        owner: "{{ repo_owner }}"
        group: "{{ repo_owner }}"
        mode: "0755"

    - name: Create service unit
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ unit_name }}.service"
        mode: '0644'
        content: |
          [Unit]
          Description=Build debs
          OnFailure={{ unit_name }}-failure-notify.service
          [Service]
          Type=oneshot
          WorkingDirectory={{ playbook_dir }}
          # Use bash to work around systemd/systemd#19751.
          ExecStart=/usr/bin/bash -c 'set -o pipefail; just build prune-repository 2>&1 | cat'

    - name: Create failure notification service unit
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ unit_name }}-failure-notify.service"
        mode: '0644'
        content: |
          [Unit]
          Description=Notify when debs build fails
          [Service]
          Type=oneshot
          ExecStart=notify-send --urgency=critical 'debs build failed' \
            'Run: journalctl --user -u {{ unit_name }}.service'

    - name: Create timer unit
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/{{ unit_name }}.timer"
        mode: '0644'
        content: |
          [Unit]
          Description=Build debs
          [Timer]
          OnCalendar=*-*-* {{ build_time }}:00
          Persistent=false
          [Install]
          WantedBy=timers.target

    - name: Enable and start notification timer
      ansible.builtin.systemd:
        name: "{{ unit_name }}.timer"
        daemon_reload: true
        enabled: true
        state: started
        scope: user
